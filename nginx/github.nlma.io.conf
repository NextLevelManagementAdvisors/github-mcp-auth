# /etc/nginx/sites-enabled/github.nlma.io
#
# Replaces the existing vhost that pointed at the github-mcp-server container
# at :3060. After this is in place, public traffic terminates at the OAuth
# gateway on :3061; the gateway in turn reverse-proxies to :3060 (container).

server {
    listen 80;
    listen [::]:80;
    server_name github.nlma.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name github.nlma.io;

    ssl_certificate     /etc/letsencrypt/live/github.nlma.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/github.nlma.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Rate limit — declare zone in /etc/nginx/conf.d/limit-req-github.conf
    limit_req zone=github_mcp burst=20 nodelay;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # MCP Streamable HTTP transport — SSE/long-poll friendly.
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
